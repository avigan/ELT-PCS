# instrument concept A: High-res VIS IFU
# (V)RI, R = 10**5, FoV ~100 mas
instru_type: IFU
postproc: MM           # MM or DI

R_min: 50_000          # [dimensionless] spectral resolution
R_max: 200_000
l0_min: 0.6            # [µm] central wavelength
l0_max: 0.9
Dl_min:  0.01          # [µm] bandwidth
Dl_max:  0.5
Nl_max: 200_000        # Maximum number of spectral channels possible (set to null for no restriction)
FoV_min: 1             # [mas] field of view
FoV_max: 500
tr_min: 0.001          # [dimensionless] instrument transmission
tr_max: 0.5
σ_m_min: 1.0e-7        # [dimensionless] level of residual speckles
σ_m_max: 1.0e-1
