# instrument concept B:  Med-res NIR IFU
# JHK, R = 10**4, FoV ~500 mas
instru_type: IFU
postproc: MM           # MM or DI

R_min: 1_000           # [dimensionless] spectral resolution
R_max: 50_000
l0_min: 0.9            # [µm] central wavelength
l0_max: 2.5
Dl_min: 0.01           # [µm] bandwidth
Dl_max: 0.5
Nl_max: null           # Maximum number of spectral channels possible (set to null for no restriction)
FoV_min: 1             # [mas] field of view
FoV_max: 1000
tr_min: 0.001          # [dimensionless] instrument transmission
tr_max: 0.5
σ_m_min: 1.0e-7        # [dimensionless] level of residual speckles
σ_m_max: 1.0e-1
