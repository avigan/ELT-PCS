# IFU instrument concept (global)
instru_type: IFU
postproc: MM              # MM or DI

R_min: 100                # [dimensionless] spectral resolution
R_max: 200_000
l0_min: 0.5               # [µm] central wavelength
l0_max: 2.5
Dl_min:  0.01             # [µm] bandwidth
Dl_max:  0.5
Nl_max: 200_000           # Maximum number of spectral channels possible (set to null for no restriction)
FoV_min: 1                # [mas] field of view
FoV_max: 2_000
tr_min: 0.001             # [dimensionless] instrument transmission
tr_max: 0.500
σ_m_min: 1.0e-7           # [dimensionless] level of residual systematics
σ_m_max: 1.0e-1
